[project]
name = "hr-aiaas-meticulous-product-and-engineering-plan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fimyh", email = "cellule.test.fimyh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.157.0",
    "httpx>=0.28.1",
    "pwdlib>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "strawberry-graphql[fastapi]>=0.336.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hr-aiaas-meticulous-product-and-engineering-plan = "hr_aiaas_meticulous_product_and_engineering_plan:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
